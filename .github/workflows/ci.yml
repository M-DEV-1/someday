# Type-checks the Worker, bundles it and runs the end-to-end test on pushes to main and on pull requests.
name: ci

# Pushes to other branches and tags are skipped, so a deployer's copy does not spend Actions minutes on them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Bundles the Worker and validates wrangler.jsonc without a Cloudflare account.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"
      # Starts wrangler dev against a fake SMTP server on ports 8799 and 2525; see test/e2e.ts.
      - run: npm test
