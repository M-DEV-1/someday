# Type-checks the Worker, bundles it and runs the end-to-end test on every push.
name: ci

# Push only: a pull request from a branch of this repository is already covered by the push, and both would run every job twice.
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Bundles the Worker and validates wrangler.jsonc without a Cloudflare account.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"
      # Starts wrangler dev against a fake SMTP server on ports 8799 and 2525; see test/e2e.mjs.
      - run: npm test
